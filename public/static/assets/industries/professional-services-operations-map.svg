<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" fill="#14121a" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" role="img" aria-labelledby="t d"><title id="t">Time and billing operations, end to end</title><desc id="d">Two band professional services map covering take on, scope and time capture, then work in progress, billing and revenue.</desc><defs><linearGradient id="zyg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ff732d"/><stop offset="0.5" stop-color="#ff0044"/><stop offset="1" stop-color="#9900ff"/></linearGradient></defs><rect x="0" y="0" width="1200" height="640" rx="12" fill="#ffffff"/><rect x="1" y="1" width="1198" height="638" rx="12" fill="none" stroke="#e0dbe9" stroke-width="2"/><image href="data:image/png;base64," x="1008" y="40" width="132" height="48"/><text x="60" y="72" font-size="26" font-weight="600" letter-spacing="-0.6" fill="#14121a">Time and billing operations, end to end</text><text x="60" y="98" font-size="14" fill="#6b6478">The stages an engagement moves through, and what we build at each one</text><text x="60" y="142" font-size="11" font-weight="600" letter-spacing="1.6" fill="#6b6478">ENGAGE</text><rect x="130" y="137" width="1010" height="2" rx="1" fill="url(#zyg)" opacity="0.85"/><rect x="60" y="164" width="344" height="176" rx="12" fill="#fcfbfd" stroke="#ece7ef" stroke-width="1"/><text x="80" y="194" font-size="11" font-weight="600" letter-spacing="0.6" fill="#9900ff">01</text><text x="80" y="220" font-size="16.5" font-weight="600" letter-spacing="-0.2" fill="#14121a">Take on and check conflicts</text><text x="80" y="268" font-size="12.5" fill="#6b6478">Take on checks against a party graph, before work</text><text x="80" y="285" font-size="12.5" fill="#6b6478">starts.</text><path d="M413 246.0 L419 252.0 L413 258.0" fill="none" stroke="#6b6478" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" opacity="0.75"/><rect x="428" y="164" width="344" height="176" rx="12" fill="#fcfbfd" stroke="#ece7ef" stroke-width="1"/><text x="448" y="194" font-size="11" font-weight="600" letter-spacing="0.6" fill="#9900ff">02</text><text x="448" y="220" font-size="16.5" font-weight="600" letter-spacing="-0.2" fill="#14121a">Agree scope and rate card</text><text x="448" y="268" font-size="12.5" fill="#6b6478">Contract, engagement and the rate card that</text><text x="448" y="285" font-size="12.5" fill="#6b6478">applies.</text><path d="M781 246.0 L787 252.0 L781 258.0" fill="none" stroke="#6b6478" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" opacity="0.75"/><rect x="796" y="164" width="344" height="176" rx="12" fill="#fcfbfd" stroke="#ece7ef" stroke-width="1"/><text x="816" y="194" font-size="11" font-weight="600" letter-spacing="0.6" fill="#9900ff">03</text><text x="816" y="220" font-size="16.5" font-weight="600" letter-spacing="-0.2" fill="#14121a">Record time and expense</text><text x="816" y="268" font-size="12.5" fill="#6b6478">Time and expense captured against the right</text><text x="816" y="285" font-size="12.5" fill="#6b6478">engagement.</text><text x="60" y="380" font-size="11" font-weight="600" letter-spacing="1.6" fill="#6b6478">DELIVER AND BILL</text><rect x="201" y="375" width="939" height="2" rx="1" fill="url(#zyg)" opacity="0.85"/><rect x="60" y="402" width="344" height="176" rx="12" fill="#fcfbfd" stroke="#ece7ef" stroke-width="1"/><text x="80" y="432" font-size="11" font-weight="600" letter-spacing="0.6" fill="#9900ff">04</text><text x="80" y="458" font-size="16.5" font-weight="600" letter-spacing="-0.2" fill="#14121a">Value the work in progress</text><text x="80" y="506" font-size="12.5" fill="#6b6478">Work in progress computed, not assembled in a</text><text x="80" y="523" font-size="12.5" fill="#6b6478">spreadsheet.</text><path d="M413 484.0 L419 490.0 L413 496.0" fill="none" stroke="#6b6478" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" opacity="0.75"/><rect x="428" y="402" width="344" height="176" rx="12" fill="#fcfbfd" stroke="#ece7ef" stroke-width="1"/><text x="448" y="432" font-size="11" font-weight="600" letter-spacing="0.6" fill="#9900ff">05</text><text x="448" y="458" font-size="16.5" font-weight="600" letter-spacing="-0.2" fill="#14121a">Bill, adjust and collect</text><text x="448" y="506" font-size="12.5" fill="#6b6478">Invoices, write offs with a reason, and collection.</text><path d="M781 484.0 L787 490.0 L781 496.0" fill="none" stroke="#6b6478" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" opacity="0.75"/><rect x="796" y="402" width="344" height="176" rx="12" fill="#fcfbfd" stroke="#ece7ef" stroke-width="1"/><text x="816" y="432" font-size="11" font-weight="600" letter-spacing="0.6" fill="#9900ff">06</text><text x="816" y="458" font-size="16.5" font-weight="600" letter-spacing="-0.2" fill="#14121a">Recognise revenue over time</text><text x="816" y="506" font-size="12.5" fill="#6b6478">Revenue recognised as progress, separate from</text><text x="816" y="523" font-size="12.5" fill="#6b6478">billing.</text></svg>